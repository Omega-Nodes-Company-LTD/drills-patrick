services:
  db:
    # PostgreSQL 18 with pgvector preinstalled.
    image: pgvector/pgvector:pg18
    container_name: pozzi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pozzi
    ports:
      - '5433:5432'
    volumes:
      - pozzi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pozzi']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pozzi-db-data:
